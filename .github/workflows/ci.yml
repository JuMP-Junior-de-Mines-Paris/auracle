name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: Migrations — analyse et cohérence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pglast
      # Analyse par le vrai parseur PostgreSQL, puis rejeu des migrations
      # sur un modèle du schéma : attrape les références à une table ou une
      # colonne qui n'existe pas encore à cet instant.
      - run: python supabase/check_migrations.py
      # Les blocs à coller doivent refléter les migrations.
      - run: |
          python supabase/bundle.py
          if ! git diff --exit-code supabase/bundles/; then
            echo "::error::supabase/bundles est périmé — relancez python supabase/bundle.py"
            exit 1
          fi

  frontend:
    name: Frontend — lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      # Le build attrape ce que les tests ne voient pas : imports cassés,
      # JSX mal fermé, modules absents.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Les réglages sont validés au démarrage par pydantic-settings ; sans
      # ces variables, l'import de app.config échoue avant tout test.
      - run: pytest -v
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-key
          VOYAGE_API_KEY: ci-placeholder-key
          ANTHROPIC_API_KEY: ci-placeholder-key
          FRONTEND_URL: http://localhost:5173
